name: Nightly

on:
  schedule:
    # 每日 UTC 03:00（北京时间 11:00）：全矩阵 + PG 必需 leg，混沌/PG 用例必跑
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  test:
    name: nightly-test (${{ matrix.os }} / node${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: test（跳过项写入 summary）
        run: >
          pnpm exec vitest run --reporter=default --reporter=json
          --outputFile=test-results/vitest.json
      - name: 跳过项汇总（不静默）
        if: always()
        shell: bash
        run: node scripts/ci-skip-summary.mjs test-results/vitest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ matrix.os }}-node${{ matrix.node }}
          path: test-results/
          retention-days: 30

  pg-required:
    name: nightly-pg (linux / node22 / postgres16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: troupe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TROUPE_REQUIRE_PG: "1"
      TROUPE_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/troupe_test
      TROUPE_TEST_PG: postgres://postgres:postgres@localhost:5432/troupe_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: test（混沌 + PG 必跑，跳过即失败）
        run: >
          pnpm exec vitest run --reporter=default --reporter=json
          --outputFile=test-results/vitest.json
      - name: 跳过项检查（REQUIRE_PG 下存在跳过 → 失败）
        if: always()
        run: node scripts/ci-skip-summary.mjs test-results/vitest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-pg-required
          path: test-results/
          retention-days: 30
